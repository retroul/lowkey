name: Suggest a tool
description: Something that belongs in the directory.
title: "Add: "
labels: ["enhancement"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official website
      placeholder: https://
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Which category?
      description: For example "Email", "Password managers", or a new one.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
      description: What does it do better than what's listed? Audits, who pays for it, how long it's been maintained, anything from "how a tool gets in" on the site.
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Runs on
      options:
        - label: Windows
        - label: macOS
        - label: Linux
        - label: Android
        - label: iOS
        - label: Web
